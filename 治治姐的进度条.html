<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>治治姐的进度条</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI','Microsoft YaHei',sans-serif}
        body{background:#fff;color:#333;min-height:100vh;padding:40px 20px;display:flex;flex-direction:column;align-items:center}
        .container{max-width:900px;width:100%;background:#f9f9f9;border-radius:20px;padding:30px;box-shadow:0 10px 30px rgba(0,0,0,0.1);margin-bottom:30px}
        h1{text-align:center;margin-bottom:30px;font-weight:600;font-size:2.5rem;color:#2c3e50}
        .tabs{display:flex;margin-bottom:30px;border-bottom:2px solid #e0e0e0}
        .tab{padding:12px 24px;background:#f0f0f0;border:none;border-radius:10px 10px 0 0;font-size:1.1rem;font-weight:600;cursor:pointer;transition:all 0.3s;margin-right:5px}
        .tab.active{background:#3498db;color:white}
        .tab-content{display:none}
        .tab-content.active{display:block}
        .input-section{display:flex;flex-direction:column;gap:20px;margin-bottom:40px}
        .input-group{display:flex;flex-direction:column;gap:10px}
        label{font-size:1.1rem;font-weight:500;color:#2c3e50}
        input[type="number"]{padding:12px 15px;border:1px solid #ddd;border-radius:10px;background:#fff;font-size:1.1rem;width:100%;text-align:center;box-shadow:0 4px 6px rgba(0,0,0,0.05);transition:border-color 0.3s}
        input[type="number"]:focus{border-color:#3498db;outline:none}
        .precision-control{display:flex;align-items:center;gap:10px;margin-top:10px}
        .precision-control label{font-size:0.9rem}
        .progress-bars{display:flex;flex-direction:column;gap:30px;margin-bottom:40px}
        .progress-bar{background:#fff;border-radius:15px;padding:20px;box-shadow:0 5px 15px rgba(0,0,0,0.05)}
        .progress-bar h3{margin-bottom:15px;font-weight:500;font-size:1.3rem;color:#2c3e50}
        .bar-container-wrapper{width:100%;max-width:600px;margin:0 auto}
        .bar-container{width:100%;padding-bottom:10%;background:#f0f0f0;border-radius:30px;overflow:hidden;position:relative;border:4px solid #d0d0d0}
        .bar-fill{position:absolute;top:0;left:0;height:100%;border-radius:30px;transition:width 0.5s}
        .percentage-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#000;font-weight:bold;font-size:3vw;z-index:2;text-shadow:1px 1px 2px rgba(255,255,255,0.7)}
        .style1 .bar-fill{background:linear-gradient(90deg,#ff9a9e 0%,#fad0c4 100%)}
        .style2 .bar-fill{background:linear-gradient(90deg,#a1c4fd 0%,#c2e9fb 100%)}
        .style3 .bar-fill{background:linear-gradient(90deg,#ffecd2 0%,#fcb69f 100%)}
        .style4 .bar-fill{background:linear-gradient(90deg,#84fab0 0%,#8fd3f4 100%)}
        .buttons{display:flex;justify-content:center;gap:20px;margin-top:20px}
        button{padding:14px 30px;border:none;border-radius:10px;background:#3498db;color:white;font-size:1.1rem;font-weight:600;cursor:pointer;transition:all 0.3s;box-shadow:0 4px 6px rgba(0,0,0,0.1)}
        button:hover{background:#2980b9;transform:translateY(-3px);box-shadow:0 7px 12px rgba(0,0,0,0.15)}
        @media (max-width:600px){.container{padding:20px}h1{font-size:2rem}.buttons{flex-direction:column}button{width:100%}.percentage-text{font-size:4.8vw}.tabs{flex-direction:column}.tab{border-radius:10px;margin-bottom:5px}}
    </style>
</head>
<body>
    <div class="container">
        <h1>治治姐的进度条</h1>
        <div class="tabs">
            <button class="tab active" data-tab="module1">百分比</button>
            <button class="tab" data-tab="module2">基准25</button>
        </div>
        
        <div id="module1" class="tab-content active">
            <div class="input-section">
                <div class="input-group">
                    <label for="percentage-input">输入百分比 :</label>
                    <input type="number" id="percentage-input" min="0" step="0.01" value="0">
                    <div class="precision-control">
                        <input type="checkbox" id="precision-toggle" checked>
                        <label for="precision-toggle">精确模式（两位小数）</label>
                    </div>
                </div>
            </div>
            <div class="progress-bars">
                <div class="progress-bar style1"><h3>渐变粉</h3><div class="bar-container-wrapper"><div class="bar-container"><div class="bar-fill" id="bar1" style="width:0%"></div><div class="percentage-text" id="text1">0%</div></div></div></div>
                <div class="progress-bar style2"><h3>渐变蓝</h3><div class="bar-container-wrapper"><div class="bar-container"><div class="bar-fill" id="bar2" style="width:0%"></div><div class="percentage-text" id="text2">0%</div></div></div></div>
                <div class="progress-bar style3"><h3>渐变橙</h3><div class="bar-container-wrapper"><div class="bar-container"><div class="bar-fill" id="bar3" style="width:0%"></div><div class="percentage-text" id="text3">0%</div></div></div></div>
                <div class="progress-bar style4"><h3>渐变绿</h3><div class="bar-container-wrapper"><div class="bar-container"><div class="bar-fill" id="bar4" style="width:0%"></div><div class="percentage-text" id="text4">0%</div></div></div></div>
            </div>
            <div class="buttons"><button id="reset-btn1">重置</button></div>
        </div>
        
        <div id="module2" class="tab-content">
            <div class="input-section">
                <div class="input-group">
                    <label for="number-input">输入数字 :</label>
                    <input type="number" id="number-input" min="0" step="0.01" value="0">
                    <div class="precision-control">
                        <input type="checkbox" id="precision-toggle2" checked>
                        <label for="precision-toggle2">精确模式（两位小数）</label>
                    </div>
                </div>
            </div>
            <div class="progress-bars">
                <div class="progress-bar style1"><h3>渐变粉</h3><div class="bar-container-wrapper"><div class="bar-container"><div class="bar-fill" id="bar5" style="width:0%"></div><div class="percentage-text" id="text5">0</div></div></div></div>
                <div class="progress-bar style2"><h3>渐变蓝</h3><div class="bar-container-wrapper"><div class="bar-container"><div class="bar-fill" id="bar6" style="width:0%"></div><div class="percentage-text" id="text6">0</div></div></div></div>
                <div class="progress-bar style3"><h3>渐变橙</h3><div class="bar-container-wrapper"><div class="bar-container"><div class="bar-fill" id="bar7" style="width:0%"></div><div class="percentage-text" id="text7">0</div></div></div></div>
                <div class="progress-bar style4"><h3>渐变绿</h3><div class="bar-container-wrapper"><div class="bar-container"><div class="bar-fill" id="bar8" style="width:0%"></div><div class="percentage-text" id="text8">0</div></div></div></div>
            </div>
            <div class="buttons"><button id="reset-btn2">重置</button></div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                document.getElementById(this.getAttribute('data-tab')).classList.add('active');
            });
        });
        
        function formatNumber(value, precisionEnabled) {
            if (!precisionEnabled) return Math.round(value).toString();
            if (value % 1 === 0) return value.toString();
            return parseFloat(value.toFixed(2)).toString();
        }
        
        const pInput = document.getElementById('percentage-input');
        const pToggle = document.getElementById('precision-toggle');
        const pBars = [document.getElementById('bar1'), document.getElementById('bar2'), document.getElementById('bar3'), document.getElementById('bar4')];
        const pTexts = [document.getElementById('text1'), document.getElementById('text2'), document.getElementById('text3'), document.getElementById('text4')];
        let pLastValue = "0";
        
        function updateProgressBars1(value) {
            const displayValue = formatNumber(value, pToggle.checked);
            const barWidth = Math.min(value, 100);
            pBars.forEach(bar => bar.style.width = `${barWidth}%`);
            pTexts.forEach(text => text.textContent = `${displayValue}%`);
        }
        
        pInput.addEventListener('input', function() {
            pLastValue = this.value;
            let value = parseFloat(this.value);
            if (!isNaN(value) && value >= 0) updateProgressBars1(value);
        });
        
        pInput.addEventListener('blur', function() {
            let value = parseFloat(this.value);
            if (isNaN(value)) this.value = pLastValue;
            else {
                if (value < 0) value = 0;
                this.value = formatNumber(value, pToggle.checked);
                pLastValue = this.value;
                updateProgressBars1(value);
            }
        });
        
        pToggle.addEventListener('change', function() {
            const currentValue = parseFloat(pInput.value);
            pInput.value = formatNumber(currentValue, this.checked);
            updateProgressBars1(currentValue);
        });
        
        document.getElementById('reset-btn1').addEventListener('click', function() {
            pInput.value = '0';
            pLastValue = '0';
            updateProgressBars1(0);
        });
        
        const nInput = document.getElementById('number-input');
        const nToggle = document.getElementById('precision-toggle2');
        const nBars = [document.getElementById('bar5'), document.getElementById('bar6'), document.getElementById('bar7'), document.getElementById('bar8')];
        const nTexts = [document.getElementById('text5'), document.getElementById('text6'), document.getElementById('text7'), document.getElementById('text8')];
        let nLastValue = "0";
        
        function updateProgressBars2(value) {
            const displayValue = formatNumber(value, nToggle.checked);
            const percentage = (value / 25) * 100;
            const barWidth = Math.min(percentage, 100);
            nBars.forEach(bar => bar.style.width = `${barWidth}%`);
            nTexts.forEach(text => text.textContent = `${displayValue}`);
        }
        
        nInput.addEventListener('input', function() {
            nLastValue = this.value;
            let value = parseFloat(this.value);
            if (!isNaN(value) && value >= 0) updateProgressBars2(value);
        });
        
        nInput.addEventListener('blur', function() {
            let value = parseFloat(this.value);
            if (isNaN(value)) this.value = nLastValue;
            else {
                if (value < 0) value = 0;
                this.value = formatNumber(value, nToggle.checked);
                nLastValue = this.value;
                updateProgressBars2(value);
            }
        });
        
        nToggle.addEventListener('change', function() {
            const currentValue = parseFloat(nInput.value);
            nInput.value = formatNumber(currentValue, this.checked);
            updateProgressBars2(currentValue);
        });
        
        document.getElementById('reset-btn2').addEventListener('click', function() {
            nInput.value = '0';
            nLastValue = '0';
            updateProgressBars2(0);
        });
    </script>
</body>
</html>
